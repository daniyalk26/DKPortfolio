<!DOCTYPE html>
<html>
<head>
    <title>Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Fake Website</h1>
    <h2>Accounts and Balances</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Amount</th>
                <th>Asset Type</th>
                <th>Instrument Type</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            {% for asset in assets %}
            <tr>
                <td>{{ asset.id }}</td>
                <td>{{ asset.title }}</td>
                <td>{{ asset.amount }}</td>
                <td>{{ asset.assetType }}</td>
                <td>{{ asset.instrumentType }}</td>
                <td>{{ asset.description }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
